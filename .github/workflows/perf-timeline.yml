name: Perf Timeline

# Records one immutable benchmark snapshot per commit on the dedicated, unprotected
# `perf-data` branch (NOT main — keeps main clean and dodges branch protection).
# The "Are we fast yet?" page (pages.yml) reads these at deploy time. Each snapshot
# is anchor-normalized, so the trend is meaningful across varying CI runners, and
# measured with the pinned corpus rather than the benchmarks the commit shipped
# with, so the instrument stays constant while the engine varies.
on:
  push:
    branches: [main]
    # Snapshot only what can move the number. A commit that changes no runtime
    # code re-measures the previous commit's tree, so its point is pure
    # measurement noise — and it still costs ~13 min on the serialized
    # concurrency group, delaying real snapshots behind it.
    #
    # This was a paths-ignore list of docs/perf/** and pages.yml, which caught
    # 2 of the 21 such commits already in the corpus. Nearly half the reachable
    # points (21 of 45) came from workflow, backfill and docs commits that
    # cannot affect a benchmark — including several that later read as outliers
    # and cost real time to explain.
    #
    # An allow-list states the rule directly: trigger on the runtime and its
    # build inputs, nothing else. A commit touching both these paths and docs
    # still triggers, which is correct.
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      # tests/** used to define 15 of the measured benchmarks outright —
      # bench_test.go, benchmark_prototype_test.go and the .ts workloads they
      # run — because bench-ratchet's default scope is pkg/vm AND ./tests.
      # It no longer does: "Overlay the pinned benchmark corpus" below replaces
      # every file bench-corpus.json names before anything is measured, so a
      # commit that edits one of them changes the tree and not the instrument.
      # It stays on the list because the overlay covers only the named files
      # while `go test ./tests` compiles the whole package: every other
      # _test.go there still comes from the target tree, and one of them
      # failing to build is the difference between a snapshot and no snapshot.
      - 'tests/**'
      # The pinned corpus IS the instrument, so bumping its version or moving
      # its ref changes what every later point measures. That has to produce a
      # snapshot of its own: without one, the first point on the new corpus is
      # whichever engine commit happens to land next, and the seam gets
      # attributed to that commit instead of to the instrument.
      - 'docs/perf/bench-corpus.json'
  # Manual backfill: dispatch once per historical commit to fill the timeline.
  # Snapshot identity is derived from the checked-out HEAD (sha + commit time),
  # so the rest of the job is commit-agnostic.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA/ref to snapshot (backfill)'
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: perf-timeline-main
  # Serialize snapshot runs — they push to the perf-data branch, which can't take
  # concurrent writers. Forward-only (one snapshot per push) means no backfill
  # bursts to queue, so cancel-in-progress: false is enough.
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the target checkout, while the tree is still this workflow's own
      # commit — a backfill target predates this script. Surfaces siblings that
      # are about to be evicted rather than queued; never fails the job. See the
      # script's header for why detection is the most a workflow can do, and why
      # prevention belongs to the dispatcher.
      - name: Check the perf-data writer queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-writer-queue-check.sh "${{ github.repository }}"

      # The reducer orchestrates the driver but never touches the engine, so it
      # belongs to this workflow's commit rather than the tree being measured —
      # the same tool/engine split bench-test262 uses, and what lets a dispatch
      # against an older commit reduce the same way a forward run does.
      #
      # A worktree rather than a copy taken before the checkout. Both work today,
      # but the copy was correct only because of step ORDER: "Check out target ref"
      # below overwrites this working tree in place, so moving or inserting a step
      # would silently start staging the TARGET commit's reducer — reintroducing
      # the forward-and-backfill-reduce-differently bug this script exists to
      # prevent, with nothing to catch it. A worktree is pinned to a sha and does
      # not care where it sits in the sequence.
      - name: Stage the macro reducer from this workflow's commit
        id: reducer
        run: |
          set -euo pipefail
          tool="${RUNNER_TEMP}/reducer-src"
          rm -rf "$tool"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          chmod +x "$tool/scripts/macro-test262-reduce.sh"
          echo "path=$tool/scripts/macro-test262-reduce.sh" >> "$GITHUB_OUTPUT"

      - name: Check out target ref
        env:
          TARGET_REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          # fetch-depth:0 pulls everything REACHABLE FROM A REF, which is not the
          # same as everything. Orphan fork-CI commits are reachable from nothing
          # on the remote, so `git checkout` fails with "unable to read tree
          # <sha>" — accurate but unhelpful, a third of the way into a 30-minute
          # job. 14 of the 47 existing snapshots sit on such commits. Name the
          # cause and the remedy instead.
          if ! git rev-parse --verify -q "${TARGET_REF}^{commit}" >/dev/null; then
            git fetch --no-tags origin "$TARGET_REF" 2>/dev/null || true
            if git rev-parse --verify -q 'FETCH_HEAD^{commit}' >/dev/null; then
              git checkout --force FETCH_HEAD
              exit 0
            fi
            cat >&2 <<MSG
          ::error::target ${TARGET_REF} is not reachable from any ref on origin.

          Nothing on the remote points at this commit, so the runner cannot fetch
          it. Publish a temporary ref, re-dispatch, and delete it only after the
          snapshot and the page have been verified:

              git push origin ${TARGET_REF}:refs/heads/backfill/${TARGET_REF}
          MSG
            exit 1
          fi
          # A short SHA is read by actions/checkout as a branch name and fails;
          # resolve any committish locally instead.
          git checkout --force "$TARGET_REF"

      # The instrument, pinned. Until now this lane took the engine and its
      # benchmarks from the same tree, so a commit touching a benchmark file
      # changed what was measured at the same moment as what was being measured.
      # Every such commit is a seam: the page can only mark it (setChangedAt,
      # microSetChangedAt) and refuse the comparison across it. Pinning stops
      # making them. perf-session.sh has measured this way since the corpus
      # existed; CI is the lane that never did.
      #
      # Script and config come from THIS WORKFLOW's commit, like the reducer and
      # the ratio verifier. A backfill target predates both, and taking the
      # config from the target tree would pin each commit to its own idea of the
      # corpus — which is the thing being removed.
      #
      # Strict on purpose. A missed overlay is not a degraded measurement, it is
      # a wrong one attributed to the engine: on 2026-07-25 one reached the
      # timeline as a +253816% regression. Failing here costs a single snapshot.
      - name: Overlay the pinned benchmark corpus
        run: |
          set -euo pipefail
          tool="${RUNNER_TEMP}/corpus-src"
          rm -rf "$tool"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          cfg="$tool/docs/perf/bench-corpus.json"

          # The config names a ref, and a fresh clone has it only as a
          # remote-tracking branch: `git show perf/bench-corpus-v2:file` fails
          # on a runner even though origin/perf/bench-corpus-v2 is sitting right
          # there. Make the name resolve locally rather than passing --ref with
          # the sha we found. Both overlay the same bytes, but --ref is recorded
          # verbatim in the stamp, so it would put a 40-character sha where a
          # session run puts `perf/bench-corpus-v2` — the same corpus with two
          # different-looking provenance records, for no gain. files_hash is
          # what the page compares; ref is what a person reads.
          ref="$(jq -r '.ref' "$cfg")"
          if ! git rev-parse --verify -q "${ref}^{commit}" >/dev/null; then
            sha="$(git rev-parse --verify -q "origin/${ref}^{commit}" || true)"
            if [ -z "$sha" ]; then
              git fetch --no-tags origin "$ref" 2>/dev/null || true
              sha="$(git rev-parse --verify -q 'FETCH_HEAD^{commit}' || true)"
            fi
            if [ -z "$sha" ]; then
              echo "::error::corpus ref ${ref} (docs/perf/bench-corpus.json) is not reachable from any ref on origin" >&2
              exit 1
            fi
            git branch --no-track "$ref" "$sha"
          fi

          bash "$tool/scripts/bench-corpus.sh" \
            --config "$cfg" --into "$GITHUB_WORKSPACE"

      # Corpus for the Test262 macro series (see "Add Test262 macro" below).
      # Keyed on the checked-out ref's .test262-rev; setup-test262.sh re-pins as needed.
      # Unconditional on this fork: the dashboard timeline wants a point per
      # snapshot, where upstream gates the macro behind [perf-test262].
      - name: Cache Test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('.test262-rev') }}
          restore-keys: test262-

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Capture snapshot
        id: snap
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          commit_epoch="$(git show -s --format=%ct HEAD)"
          stamp="$(date -u -d "@${commit_epoch}" +%Y%m%dT%H%M%SZ)"
          name="${stamp}-${short_sha}.json"
          out="${RUNNER_TEMP}/${name}"

          count=3
          benchtime=1s

          # Protocol flags are pinned rather than inherited. bench-ratchet's
          # defaults are ours to change and #22 makes `mean` the default
          # upstream with `min` opt-in — on the day that reaches this tree, an
          # unpinned lane would switch reducer with no diff here to explain it,
          # and every comparison against an existing snapshot would silently
          # cross reducers. The b.N checks are named for the same reason: a
          # warning that depends on a default is a warning that can vanish.
          go run ./cmd/bench-ratchet \
            -count "${count}" -benchtime "${benchtime}" -timeout 20m \
            -reducer min -min-iterations 20 -iteration-tolerance 0.02 \
            -baseline "${out}" \
            snapshot

          # Record WHAT WAS MEASURED, so a later reader can tell a diff-shaped
          # cause from an engine change.
          #
          # HOW it was measured (method.reducer/count/benchtime) is no longer
          # written here: bench-ratchet writes it itself, from the code that does
          # the reducing and the flags it was actually given. This step used to
          # assert reducer:"min" as a literal, which was true only for as long as
          # bench-ratchet's unconditional min survived — nooga#22 makes mean the
          # default with min opt-in, and on that day the literal would have gone
          # on claiming "min" for snapshots reduced by mean. Provenance that can
          # disagree with the thing it describes is worse than none, because it
          # gets trusted.
          #
          # engine_files is the one that pays off soonest. Several of the largest
          # moves on this timeline sit on commits that touch no engine code at all
          # (976a3faa moved ~24% while only adding workflows and scripts), and that
          # is the single most diagnostic fact about a suspicious point — but it is
          # a property of the diff, which a static page can never compute.
          subject="$(git log -1 --format=%s HEAD)"
          committed_at="$(git log -1 --format=%cI HEAD)"
          if git rev-parse --verify -q HEAD^ >/dev/null; then
            changed="$(git diff --name-only HEAD^ HEAD)"
          else
            changed="$(git ls-tree -r --name-only HEAD)"   # root commit
          fi
          files_changed="$(printf '%s\n' "$changed" | grep -c . || true)"
          # "Engine" = the interpreter itself, excluding the perf tooling that lives
          # beside it — a change to bench-ratchet or perf-* is not a change to what
          # is being measured.
          engine_changed="$(printf '%s\n' "$changed" \
            | grep -E '^(pkg|cmd)/' \
            | grep -vE '^(pkg/perfdata/|cmd/(bench-|perf-))' \
            | grep -c . || true)"

          jq --arg s "$subject" --arg ca "$committed_at" \
             --argjson fc "${files_changed:-0}" --argjson ec "${engine_changed:-0}" \
             '. + {
                commit: { subject: $s, committed_at: $ca,
                          files_changed: $fc, engine_files_changed: $ec }
              }' "${out}" > "${out}.tmp" && mv "${out}.tmp" "${out}"

          # A forward snapshot runs MAIN's bench-ratchet, which always writes this,
          # so a missing method there means something broke and an unlabelled point
          # is not worth publishing.
          #
          # A backfill runs the TARGET COMMIT's bench-ratchet — it has to, that is
          # the engine being measured — and every commit before the field existed
          # cannot produce it. Demanding provenance there makes backfill impossible.
          # This assertion did exactly that on its first night: it measured five
          # historical commits successfully and then threw all five away.
          if jq -e '.method.reducer and .method.count and .method.benchtime' "${out}" >/dev/null 2>&1; then
            echo "method: $(jq -c '.method' "${out}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::bench-ratchet wrote no method provenance" >&2
            exit 1
          else
            echo "::warning::no method provenance: ${short_sha} predates the field. Expected for a backfill."
          fi

          # An overlay is only worth anything if it reached the measurement.
          # CorpusAt returns nil for a stamp that no longer describes the tree,
          # so an absent method.corpus here means the run measured the target's
          # own benchmarks — the silent case the overlay exists to prevent, and
          # one that is indistinguishable from an engine change once published.
          #
          # Warned rather than fatal on a dispatch, for the same reason as the
          # method check above: a backfill runs the TARGET's bench-ratchet, and
          # one predating CorpusAt cannot record what it was handed.
          if jq -e '.method.corpus.files_hash' "${out}" >/dev/null 2>&1; then
            echo "corpus: $(jq -c '.method.corpus' "${out}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::snapshot records no corpus — the overlay did not reach the measurement" >&2
            exit 1
          else
            echo "::warning::no corpus stamp: ${short_sha}'s bench-ratchet predates CorpusAt. Expected for a backfill."
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "out=${out}" >> "$GITHUB_OUTPUT"


      # Fold the Test262 macro-benchmark into the snapshot as the `test262.*` series
      # — the total plus one per top-level suite. Adds ~4 min/snapshot. Non-fatal: a macro hiccup must never drop
      # the micro snapshot that's already captured above. Backfilling pre-PR#10
      # commits needs scripts/macro-test262.sh grafted in — they don't ship it.
      # Unconditional here; upstream gates this on [perf-test262].
      - name: Add Test262 macro to snapshot
        continue-on-error: true
        env:
          PER_TEST_TIMEOUT: 1.2s
        run: |
          set -euo pipefail
          out="${{ steps.snap.outputs.out }}"
          ./setup-test262.sh
          anchor_ns="$(jq -r '.anchor.ns_per_op' "$out")"

          # Reps are run and reduced by scripts/macro-test262-reduce.sh, shared with
          # the backfill so the two cannot reduce differently. It emits one entry per
          # series. See the script's header for the reducer choice and the guards.
          #
          # No anchor_ns_per_op: micro and macro are measured in the same run here, so
          # the profile's own anchor is the correct divisor. The backfill is the case
          # that isn't, and it passes MACRO_RECORD_ANCHOR=1.
          entries="${RUNNER_TEMP}/t262.entries.json"
          rc=0
          "${{ steps.reducer.outputs.path }}" "$anchor_ns" "$entries" >/dev/null || rc=$?
          # 3 is "this engine passes nothing", a real answer about an old tree rather
          # than a failure of the measurement. Everything else stops the fold: this step
          # is continue-on-error so the micro snapshot still publishes. The missing
          # macro point is then detectable with scripts/perf-gaps.sh section [2] —
          # which lives on the `tools/perf-runbook` branch, not main, so nothing
          # surfaces the gap automatically. Check it after a run that skipped.
          if [ "$rc" -eq 3 ]; then
            echo "test262: no passing tests — skipped"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

          jq --slurpfile e "$entries" '.benchmarks += $e[0]' "$out" > "${out}.tmp"
          mv "${out}.tmp" "$out"

      # Convert to the machine-keyed v2 layout. bench-ratchet still writes v1 —
      # it is shared with perf-pr and baseline.json, and none of that needs to
      # change — so the timeline wraps its output here instead. That keeps the
      # format change confined to the corpus that actually has the problem.
      #
      # The problem: a v1 filename is "<stamp>-<sha>.json" with no machine in it,
      # so a re-run on a different CPU tier OVERWRITES the previous tier's
      # measurement rather than adding to it. That is why the page had to filter
      # to a modal CPU and hide the rest, and it is what blocks both a local-machine
      # series and accumulating repeated samples per commit.
      #
      # Reuses cmd/perf-migrate rather than reimplementing the rename+wrap: it is
      # already proven idempotent and verbatim against the live corpus. Run from
      # the workflow's own commit for the same reason as the ratio verifier —
      # backfills check out old trees that predate the tool.
      - name: Convert snapshot to machine-keyed v2
        id: v2
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/v2stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp "${{ steps.snap.outputs.out }}" "$stage/${{ steps.snap.outputs.name }}"

          tool="${RUNNER_TEMP}/converter"
          rm -rf "$tool"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          ( cd "$tool" && go run ./cmd/perf-migrate -dir "$stage" -v )

          converted="$(find "$stage" -maxdepth 1 -name '*.json' | head -1)"
          [ -n "$converted" ] || { echo "conversion produced no file" >&2; exit 1; }
          echo "name=$(basename "$converted")" >> "$GITHUB_OUTPUT"
          echo "out=${converted}" >> "$GITHUB_OUTPUT"
          echo "converted to $(basename "$converted")"

      # Cosmetic. A broken table must never cost a snapshot: the measurement is
      # already captured and about to be verified, and re-running it is ~17
      # minutes on a serialized queue. This step failing is exactly how the two
      # snapshots after the v2 cutover were lost — the publish below is the step
      # that is allowed to be strict.
      - name: Render run summary
        continue-on-error: true
        run: |
          src="${{ steps.v2.outputs.out }}"
          {
            echo "## Snapshot ${{ steps.v2.outputs.name }}"
            echo
            prof="$(jq -c '(.machines[]? // .)' "$src")"
            echo "anchor \`$(printf '%s' "$prof" | jq -r '.anchor.ns_per_op')\` ns/op · machine \`$(printf '%s' "$prof" | jq -r '.machine.cpu_model')\` · go \`$(printf '%s' "$prof" | jq -r '.machine.go_version')\`"
            echo
            echo "| Benchmark | Anchor× | Wall (ns/op) | Allocs/op |"
            echo "|---|---:|---:|---:|"
            # No file argument: jq must read $prof from stdin. Passing "$src" too
            # makes jq read the FILE and ignore the pipe, which was invisible under
            # v1 (the file and the profile were the same object) and fatal under v2
            # (.benchmarks lives under .machines[], so the file's top-level
            # .benchmarks is null and to_entries dies). That is what has blocked
            # every forward snapshot since the v2 cutover.
            printf '%s' "$prof" | jq -r '.benchmarks | to_entries | sort_by(-.value.ratio_to_anchor)[]
                   | "| \(.key | sub("github.com/nooga/paserati/";"")) | \((.value.ratio_to_anchor*1000|round)/1000) | \(.value.ns_per_op|round) | \(.value.allocs_per_op) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to perf-data branch
        run: |
          set -euo pipefail
          name="${{ steps.v2.outputs.name }}"
          src="${{ steps.v2.outputs.out }}"
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          wt="${RUNNER_TEMP}/perf-data"

          if git ls-remote --exit-code --heads "$remote" perf-data >/dev/null 2>&1; then
            git clone --depth 1 --branch perf-data "$remote" "$wt"
          else
            # First run: orphan branch with no history/files.
            git clone --depth 1 "$remote" "$wt"
            git -C "$wt" checkout --orphan perf-data
            git -C "$wt" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$wt/timeline"
          cp "$src" "$wt/timeline/$name"

          # Gate on the ratio_to_anchor invariant BEFORE publishing: a ratio must
          # equal ns_per_op / anchor.ns_per_op for its own snapshot, or it is
          # normalized against something else and compares to nothing.
          #
          # This is not hypothetical. Every snapshot before c4c332f had its
          # test262.total ratio computed against a foreign anchor — the jq
          # injection step above reused a global one — and the error read as a
          # trend rather than as noise (five consecutive commits ~13% low with a
          # hard boundary at each end), so it survived for a month. See
          # cmd/perf-fixratio.
          #
          # The whole corpus is checked, not just the new file: perf-data is
          # already cloned here, so covering history costs nothing and catches
          # hand-edits or a bad backfill as well as a bad forward run. Blocking is
          # deliberate — publishing a known-wrong number is worse than losing one
          # snapshot, and the repair is a single command.
          #
          # Run the tool from THIS WORKFLOW's commit, not the checked-out tree. A
          # backfill checks out the target ref (see "Check out target ref"), and
          # old commits predate cmd/perf-fixratio — invoking it from the tree would
          # fail the publish step for every backfill, which is the opposite of a
          # safety net. The worktree gives us the tool at a known-good revision
          # while the target tree stays as the benchmarks measured it.
          tool="${RUNNER_TEMP}/verifier"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          ( cd "$tool" && go run ./cmd/perf-fixratio -dir "$wt/timeline" -verify -v )

          git -C "$wt" config user.name "github-actions[bot]"
          git -C "$wt" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wt" add timeline
          if git -C "$wt" diff --cached --quiet; then
            echo "snapshot already present — nothing to publish"
            exit 0
          fi
          git -C "$wt" commit -m "perf: snapshot ${name}"
          git -C "$wt" push "$remote" HEAD:perf-data
