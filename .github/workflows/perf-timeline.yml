name: Perf Timeline

# Records one immutable benchmark snapshot per commit on the dedicated, unprotected
# `perf-data` branch (NOT main — keeps main clean and dodges branch protection).
# The "Are we fast yet?" page (pages.yml) reads these at deploy time. Each snapshot
# is anchor-normalized, so the trend is meaningful across varying CI runners.
on:
  push:
    branches: [main]
    paths-ignore:
      # The page, its assets, and its deploy workflow contain no engine code, so a
      # snapshot of such a commit just re-measures the previous commit's tree — a
      # duplicate point that reads on the chart as a commit. It also costs ~13 min
      # on the serialized concurrency group, which delays real snapshots behind it.
      # A commit touching these AND engine code still triggers: paths-ignore only
      # skips when EVERY changed path matches.
      - 'docs/perf/**'
      - '.github/workflows/pages.yml'
  # Manual backfill: dispatch once per historical commit to fill the timeline.
  # Snapshot identity is derived from the checked-out HEAD (sha + commit time),
  # so the rest of the job is commit-agnostic.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA/ref to snapshot (backfill)'
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: perf-timeline-main
  # Serialize snapshot runs — they push to the perf-data branch, which can't take
  # concurrent writers. Forward-only (one snapshot per push) means no backfill
  # bursts to queue, so cancel-in-progress: false is enough.
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out target ref
        env:
          TARGET_REF: ${{ github.event.inputs.ref || github.sha }}
        run: |
          # A short SHA is read by actions/checkout as a branch name and fails;
          # fetch-depth:0 pulled everything, so resolve any committish locally.
          git checkout --force "$TARGET_REF"

      # Corpus for the Test262 macro series (see "Add Test262 macro" below).
      # Keyed on the checked-out ref's .test262-rev; setup-test262.sh re-pins as needed.
      # Unconditional on this fork: the dashboard timeline wants a point per
      # snapshot, where upstream gates the macro behind [perf-test262].
      - name: Cache Test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('.test262-rev') }}
          restore-keys: test262-

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Capture snapshot
        id: snap
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          commit_epoch="$(git show -s --format=%ct HEAD)"
          stamp="$(date -u -d "@${commit_epoch}" +%Y%m%dT%H%M%SZ)"
          name="${stamp}-${short_sha}.json"
          out="${RUNNER_TEMP}/${name}"

          # Kept in shell vars so the recorded provenance below can't drift from
          # the flags actually used.
          count=3
          benchtime=1s

          go run ./cmd/bench-ratchet \
            -count "${count}" -benchtime "${benchtime}" -timeout 20m \
            -baseline "${out}" \
            snapshot

          # Record WHAT WAS MEASURED and HOW, so a later reader can tell a protocol
          # change from an engine change. Neither was recoverable before: the page
          # could detect a CPU change and a test-set change, but a benchtime or
          # reducer change was invisible, and both have shifted over this series.
          #
          # engine_files is the one that pays off soonest. Several of the largest
          # moves on this timeline sit on commits that touch no engine code at all
          # (976a3faa moved ~24% while only adding workflows and scripts), and that
          # is the single most diagnostic fact about a suspicious point — but it is
          # a property of the diff, which a static page can never compute.
          subject="$(git log -1 --format=%s HEAD)"
          committed_at="$(git log -1 --format=%cI HEAD)"
          if git rev-parse --verify -q HEAD^ >/dev/null; then
            changed="$(git diff --name-only HEAD^ HEAD)"
          else
            changed="$(git ls-tree -r --name-only HEAD)"   # root commit
          fi
          files_changed="$(printf '%s\n' "$changed" | grep -c . || true)"
          # "Engine" = the interpreter itself, excluding the perf tooling that lives
          # beside it — a change to bench-ratchet or perf-* is not a change to what
          # is being measured.
          engine_changed="$(printf '%s\n' "$changed" \
            | grep -E '^(pkg|cmd)/' \
            | grep -vE '^(pkg/perfdata/|cmd/(bench-|perf-))' \
            | grep -c . || true)"

          jq --arg s "$subject" --arg ca "$committed_at" \
             --argjson fc "${files_changed:-0}" --argjson ec "${engine_changed:-0}" \
             --arg bt "$benchtime" --argjson ct "$count" \
             '. + {
                commit: { subject: $s, committed_at: $ca,
                          files_changed: $fc, engine_files_changed: $ec },
                method: { benchtime: $bt, count: $ct, reducer: "min" }
              }' "${out}" > "${out}.tmp" && mv "${out}.tmp" "${out}"
          # reducer is bench-ratchet's contract (aggregateFromFile, locked by
          # TestAggregateFromFileUsesMin). If that ever changes, change it here too.

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "out=${out}" >> "$GITHUB_OUTPUT"


      # Fold the Test262 macro-benchmark into the snapshot as a `test262.total`
      # series. Adds ~4 min/snapshot. Non-fatal: a macro hiccup must never drop
      # the micro snapshot that's already captured above. Backfilling pre-PR#10
      # commits needs scripts/macro-test262.sh grafted in — they don't ship it.
      # Unconditional here; upstream gates this on [perf-test262].
      - name: Add Test262 macro to snapshot
        continue-on-error: true
        env:
          PER_TEST_TIMEOUT: 1.2s
        run: |
          set -euo pipefail
          out="${{ steps.snap.outputs.out }}"
          ./setup-test262.sh

          # Run the macro MACRO_COUNT times and keep the MIN summed-ns total: a single
          # suite run is heavily contaminated by one-directional runner noise (GC, CPU
          # migration, co-tenancy); min selects the least-contaminated run (#28), same
          # rationale as the bench-ratchet A/B reducer (#22). passing count and set_hash
          # are run-invariant; carry them from the winning run.
          count="${MACRO_COUNT:-3}"
          total_ns=""; passed=""; set_hash=""
          for rep in $(seq 1 "$count"); do
            ./scripts/macro-test262.sh "${RUNNER_TEMP}/t262.jsonl" "${RUNNER_TEMP}/t262.stats.json"
            rep_ns="$(jq 'select(.name=="total") | .ns_per_op' "${RUNNER_TEMP}/t262.jsonl")"
            echo "  macro rep ${rep}/${count}: total=${rep_ns} ns"
            if [ -z "$total_ns" ] || jq -n --argjson a "$rep_ns" --argjson b "$total_ns" -e '$a < $b' >/dev/null; then
              total_ns="$rep_ns"
              passed="$(jq 'select(.name=="total") | .iterations' "${RUNNER_TEMP}/t262.jsonl")"
              set_hash="$(jq -r 'select(.name=="total") | .set_hash // ""' "${RUNNER_TEMP}/t262.jsonl")"
            fi
          done
          anchor_ns="$(jq -r '.anchor.ns_per_op' "$out")"

          # Mean over an empty passing set is undefined — skip the fold.
          if [ "${passed:-0}" -gt 0 ]; then
          # Metric is the MEAN per-test ns (summed_ns / passing_count), not the sum: the
          # sum conflates per-test speed with pass-count (#26); the mean removes that
          # count-inflation. set_hash fingerprints the contributing set (#24) so a residual
          # composition shift the mean can't cancel stays visible — soft, omitted until
          # #24's tooling lands. Anchor-normalized; the page plots each series self-relative.
          mean_ns="$(jq -n --argjson n "$total_ns" --argjson p "$passed" '$n / $p')"
          jq --argjson m "$mean_ns" --argjson a "$anchor_ns" --argjson p "$passed" --arg h "$set_hash" '
            .benchmarks["test262.total"] = ({
              ns_per_op: $m, allocs_per_op: 0, bytes_per_op: 0,
              ratio_to_anchor: ($m / $a),
              samples: [{ iterations: $p, ns_per_op: $m, ratio_to_anchor: ($m / $a) }]
            } + (if $h == "" then {} else { set_hash: $h } end))' "$out" > "${out}.tmp"
          mv "${out}.tmp" "$out"
          echo "test262.total: mean $(jq -r '.benchmarks["test262.total"].ns_per_op' "$out") ns/test" \
               "over ${passed} passing (set ${set_hash:-none}, min of ${count} runs," \
               "ratio $(jq -r '.benchmarks["test262.total"].ratio_to_anchor' "$out"))"
          else
            echo "test262.total: no passing tests — skipped"
          fi

      # Convert to the machine-keyed v2 layout. bench-ratchet still writes v1 —
      # it is shared with perf-pr and baseline.json, and none of that needs to
      # change — so the timeline wraps its output here instead. That keeps the
      # format change confined to the corpus that actually has the problem.
      #
      # The problem: a v1 filename is "<stamp>-<sha>.json" with no machine in it,
      # so a re-run on a different CPU tier OVERWRITES the previous tier's
      # measurement rather than adding to it. That is why the page had to filter
      # to a modal CPU and hide the rest, and it is what blocks both a local-machine
      # series and accumulating repeated samples per commit.
      #
      # Reuses cmd/perf-migrate rather than reimplementing the rename+wrap: it is
      # already proven idempotent and verbatim against the live corpus. Run from
      # the workflow's own commit for the same reason as the ratio verifier —
      # backfills check out old trees that predate the tool.
      - name: Convert snapshot to machine-keyed v2
        id: v2
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/v2stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp "${{ steps.snap.outputs.out }}" "$stage/${{ steps.snap.outputs.name }}"

          tool="${RUNNER_TEMP}/converter"
          rm -rf "$tool"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          ( cd "$tool" && go run ./cmd/perf-migrate -dir "$stage" -v )

          converted="$(find "$stage" -maxdepth 1 -name '*.json' | head -1)"
          [ -n "$converted" ] || { echo "conversion produced no file" >&2; exit 1; }
          echo "name=$(basename "$converted")" >> "$GITHUB_OUTPUT"
          echo "out=${converted}" >> "$GITHUB_OUTPUT"
          echo "converted to $(basename "$converted")"

      - name: Render run summary
        run: |
          src="${{ steps.v2.outputs.out }}"
          {
            echo "## Snapshot ${{ steps.v2.outputs.name }}"
            echo
            prof="$(jq -c '(.machines[]? // .)' "$src")"
            echo "anchor \`$(printf '%s' "$prof" | jq -r '.anchor.ns_per_op')\` ns/op · machine \`$(printf '%s' "$prof" | jq -r '.machine.cpu_model')\` · go \`$(printf '%s' "$prof" | jq -r '.machine.go_version')\`"
            echo
            echo "| Benchmark | Anchor× | Wall (ns/op) | Allocs/op |"
            echo "|---|---:|---:|---:|"
            printf '%s' "$prof" | jq -r '.benchmarks | to_entries | sort_by(-.value.ratio_to_anchor)[]
                   | "| \(.key | sub("github.com/nooga/paserati/";"")) | \((.value.ratio_to_anchor*1000|round)/1000) | \(.value.ns_per_op|round) | \(.value.allocs_per_op) |"' "$src"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to perf-data branch
        run: |
          set -euo pipefail
          name="${{ steps.v2.outputs.name }}"
          src="${{ steps.v2.outputs.out }}"
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          wt="${RUNNER_TEMP}/perf-data"

          if git ls-remote --exit-code --heads "$remote" perf-data >/dev/null 2>&1; then
            git clone --depth 1 --branch perf-data "$remote" "$wt"
          else
            # First run: orphan branch with no history/files.
            git clone --depth 1 "$remote" "$wt"
            git -C "$wt" checkout --orphan perf-data
            git -C "$wt" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$wt/timeline"
          cp "$src" "$wt/timeline/$name"

          # Gate on the ratio_to_anchor invariant BEFORE publishing: a ratio must
          # equal ns_per_op / anchor.ns_per_op for its own snapshot, or it is
          # normalized against something else and compares to nothing.
          #
          # This is not hypothetical. Every snapshot before c4c332f had its
          # test262.total ratio computed against a foreign anchor — the jq
          # injection step above reused a global one — and the error read as a
          # trend rather than as noise (five consecutive commits ~13% low with a
          # hard boundary at each end), so it survived for a month. See
          # cmd/perf-fixratio.
          #
          # The whole corpus is checked, not just the new file: perf-data is
          # already cloned here, so covering history costs nothing and catches
          # hand-edits or a bad backfill as well as a bad forward run. Blocking is
          # deliberate — publishing a known-wrong number is worse than losing one
          # snapshot, and the repair is a single command.
          #
          # Run the tool from THIS WORKFLOW's commit, not the checked-out tree. A
          # backfill checks out the target ref (see "Check out target ref"), and
          # old commits predate cmd/perf-fixratio — invoking it from the tree would
          # fail the publish step for every backfill, which is the opposite of a
          # safety net. The worktree gives us the tool at a known-good revision
          # while the target tree stays as the benchmarks measured it.
          tool="${RUNNER_TEMP}/verifier"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          ( cd "$tool" && go run ./cmd/perf-fixratio -dir "$wt/timeline" -verify -v )

          git -C "$wt" config user.name "github-actions[bot]"
          git -C "$wt" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wt" add timeline
          if git -C "$wt" diff --cached --quiet; then
            echo "snapshot already present — nothing to publish"
            exit 0
          fi
          git -C "$wt" commit -m "perf: snapshot ${name}"
          git -C "$wt" push "$remote" HEAD:perf-data
