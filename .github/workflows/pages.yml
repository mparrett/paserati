name: Perf Page

# Deploys the "Are we fast yet?" trend page to GitHub Pages. The per-commit
# snapshots live on the `perf-data` branch (written by perf-timeline.yml); we pull
# them in, generate a filename manifest (static JS can't glob a directory), and
# serve docs/perf/ as the site. Requires Pages enabled: Settings → Pages → Source
# = GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'docs/perf/index.html'
      - '.github/workflows/pages.yml'
  # Redeploy after each snapshot so the page reflects new timeline points.
  workflow_run:
    workflows: ["Perf Timeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Don't cancel an in-progress deploy: during a burst of snapshots the last
  # trigger's run survives as pending and runs after the final snapshot's push,
  # so the deployed manifest reflects all of them. Cancelling mid-flight let an
  # earlier deploy win with stale perf-data (the backfill-burst race).
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # push/dispatch always build; a Perf Timeline completion only redeploys if it
    # actually produced a snapshot (succeeded).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the manifest below is emitted in topological commit
          # order, which needs every snapshotted commit to be reachable.
          fetch-depth: 0

      - name: Pull timeline snapshots from perf-data
        run: |
          set -euo pipefail
          mkdir -p docs/perf/timeline
          if git ls-remote --exit-code --heads origin perf-data >/dev/null 2>&1; then
            git fetch --depth 1 origin perf-data
            if git checkout FETCH_HEAD -- timeline 2>/dev/null; then
              rm -rf docs/perf/timeline
              mv timeline docs/perf/timeline
              echo "Loaded $(find docs/perf/timeline -maxdepth 1 -name '*.json' | wc -l) snapshot(s)."
            else
              echo "perf-data has no timeline/ yet; page will be empty."
            fi
          else
            echo "perf-data branch does not exist yet; page will be empty."
          fi

      - name: Generate timeline manifest
        run: |
          set -euo pipefail
          # Static JS can't list a directory over HTTP, so emit the filenames.
          #
          # Emit them in TOPOLOGICAL COMMIT ORDER. Snapshot filenames start with the
          # commit stamp, so the page sorts on that — but a rebased stack routinely
          # shares a commit second (three of the vm-microopt commits sit on the same
          # one), and nothing in the filename encodes parentage. The page's sort is
          # stable, so whatever order this manifest lists ties in is the order they
          # render. Rank by `git rev-list` position and the page gets true commit
          # order for free; snapshots whose sha is unreachable (dropped branch, force
          # push) rank last and keep their filename order among themselves.
          find docs/perf/timeline -maxdepth 1 -name '*.json' ! -name index.json -printf '%f\n' \
            | sort > /tmp/snaps.txt

          # sha -> position in topological order. NOT --first-parent: commits that
          # arrived through a merge (every backfilled vm-microopt commit did) are
          # reachable from HEAD but absent from first-parent history, so they would
          # all rank "unknown" and fall back to filename order — the exact tie this
          # step exists to break. --topo-order guarantees ancestors before descendants.
          git rev-list --topo-order --reverse HEAD \
            | awk '{ print substr($0, 1, 12), NR }' > /tmp/rank.txt

          # Filename is "<stamp>-<sha12>.json"; join on the sha, defaulting to a
          # rank past the end so unknown commits sort last rather than first.
          unknown="$(( $(wc -l < /tmp/rank.txt) + 1 ))"
          while read -r f; do
            sha="${f#*-}"; sha="${sha%.json}"
            rank="$(awk -v s="$sha" '$1 == s { print $2; found=1; exit } END { if (!found) print "'"$unknown"'" }' /tmp/rank.txt)"
            printf '%s\t%s\n' "$rank" "$f"
          done < /tmp/snaps.txt | sort -k1,1n -k2,2 | cut -f2 \
            | jq -R . | jq -s . > docs/perf/timeline/index.json

          [ -s docs/perf/timeline/index.json ] || echo "[]" > docs/perf/timeline/index.json
          echo "manifest: $(cat docs/perf/timeline/index.json)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/perf

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
