name: Perf Test262 Backfill

# One-off backfill: measure an OLD commit's Test262 macro on a CURRENT runner and
# inject `test262.total` into that commit's EXISTING perf-data snapshot — without
# touching its historical micro-benchmarks (so an existing spike/dip stays visible
# to overlay against).
#
# Pre-PR#10 commits lack cmd/bench-test262, so the macro tooling is grafted from
# main; the engine measured stays the target commit's. Normalization uses a FRESH
# anchor measured on the same runner as the macro (run-to-run anchor drift is
# exactly what the ratio cancels), so backfilled points stay comparable to the
# forward ones.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to backfill test262.total into (must already have a snapshot)'
        required: true

permissions:
  contents: write

concurrency:
  # Share the perf-data writer lock with the timeline so snapshots don't collide.
  group: perf-timeline-main
  cancel-in-progress: false

env:
  PER_TEST_TIMEOUT: 1.2s

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out target ref + graft macro tooling from main
        env:
          TARGET_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          # Orphan fork-CI commits aren't ref-reachable, so checkout@v4 didn't fetch
          # them; fetch the target explicitly (it must be pushed to a ref to be
          # fetchable — see the backfill/* temp branches).
          git fetch --no-tags origin "$TARGET_REF"
          git checkout --force FETCH_HEAD
          # Graft just the macro tooling (absent or older on pre-PR#10 commits) so
          # the methodology matches the forward snapshots. Engine stays the target's.
          git checkout "$main_sha" -- cmd/bench-test262 scripts/macro-test262.sh

      - name: Cache Test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('.test262-rev') }}
          restore-keys: test262-

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Measure macro + fresh anchor, inject into existing snapshot
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"

          # Fresh anchor on THIS runner, same run as the macro → comparable ratio.
          anchor_ns="$(go test -run '^$' -bench '^BenchmarkRatchetAnchor$' -count 3 ./pkg/vm 2>/dev/null \
            | awk '/BenchmarkRatchetAnchor/ { sum += $3; n++ } END { if (n) printf "%.6f", sum/n }')"
          [ -n "$anchor_ns" ] || { echo "failed to measure anchor" >&2; exit 1; }

          ./setup-test262.sh

          # Run the macro MACRO_COUNT times and keep the MIN summed-ns total. A single
          # suite run is heavily contaminated by one-directional runner noise (GC, CPU
          # migration, co-tenancy); the timeline showed ~6% run-to-run scatter that
          # swamped the engine-change signal (#28). Min selects the least-contaminated
          # run — same rationale as the bench-ratchet A/B reducer (#22). passing count
          # and set_hash are run-invariant; carry them from the winning run.
          count="${MACRO_COUNT:-3}"
          total_ns=""; passed=""; set_hash=""
          for rep in $(seq 1 "$count"); do
            ./scripts/macro-test262.sh "${RUNNER_TEMP}/t262.jsonl" "${RUNNER_TEMP}/t262.stats.json"
            rep_ns="$(jq 'select(.name=="total") | .ns_per_op' "${RUNNER_TEMP}/t262.jsonl")"
            echo "  macro rep ${rep}/${count}: total=${rep_ns} ns"
            if [ -z "$total_ns" ] || jq -n --argjson a "$rep_ns" --argjson b "$total_ns" -e '$a < $b' >/dev/null; then
              total_ns="$rep_ns"
              passed="$(jq  'select(.name=="total") | .iterations'  "${RUNNER_TEMP}/t262.jsonl")"
              set_hash="$(jq -r 'select(.name=="total") | .set_hash // ""' "${RUNNER_TEMP}/t262.jsonl")"
            fi
          done

          # Mean over an empty passing set is undefined — nothing meaningful to inject.
          [ "${passed:-0}" -gt 0 ] || { echo "no passing tests for ${short_sha} — skipping" >&2; exit 1; }

          # Metric MUST match the forward timeline (perf-timeline.yml, da8af1c): the
          # MEAN per-test ns (summed_ns / passing_count), not the sum. The sum conflates
          # per-test speed with pass-count (#26), so a sum-era backfill point would be
          # incomparable to the mean-era forward points on the same series. set_hash is
          # soft — absent until bench-test262 (#24) is on main, in which case it's omitted.
          mean_ns="$(jq -n --argjson n "$total_ns" --argjson p "$passed" '$n / $p')"
          ratio="$(jq -n --argjson m "$mean_ns" --argjson a "$anchor_ns" '$m / $a')"
          echo "anchor=${anchor_ns} ns/op · mean=${mean_ns} ns/test over ${passed} passing (set ${set_hash:-none}) · ratio=${ratio}"

          # Update THIS commit's existing snapshot on perf-data (micro untouched).
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          wt="${RUNNER_TEMP}/perf-data"
          git clone --depth 1 --branch perf-data "$remote" "$wt"
          # Matches both layouts: "<stamp>-<sha>.json" (v1) and
          # "<stamp>-<sha>-<machine-slug>.json" (v2).
          snap="$(find "$wt/timeline" \( -name "*-${short_sha}.json" -o -name "*-${short_sha}-*.json" \) | head -1)"
          [ -n "$snap" ] || { echo "no existing snapshot for ${short_sha} — run the timeline first" >&2; exit 1; }

          # STOP on machine-keyed snapshots. The jq below writes .benchmarks at the
          # top level, which in v2 is nested per machine profile — so it would add a
          # stray top-level key and leave the real series untouched, i.e. corrupt
          # the file while reporting success.
          #
          # This workflow is also where the foreign-anchor ratio bug came from: it
          # computed ratio_to_anchor against an anchor that wasn't the snapshot's
          # own, and nothing checked the result for a month (see cmd/perf-fixratio).
          # Failing loudly is the right default until it is either taught v2 and
          # per-profile anchors, or retired — the forward timeline now captures the
          # test262 macro unconditionally, which is most of what this existed for.
          if jq -e '.machines' "$snap" >/dev/null 2>&1; then
            echo "refusing to edit $(basename "$snap"): machine-keyed (v2) snapshot." >&2
            echo "This workflow only understands the flat v1 layout and would corrupt it." >&2
            exit 1
          fi

          jq --argjson m "$mean_ns" --argjson r "$ratio" --argjson p "$passed" --arg h "$set_hash" '
            .benchmarks["test262.total"] = ({
              ns_per_op: $m, allocs_per_op: 0, bytes_per_op: 0, ratio_to_anchor: $r,
              samples: [{ iterations: $p, ns_per_op: $m, ratio_to_anchor: $r }]
            } + (if $h == "" then {} else { set_hash: $h } end))' "$snap" > "$snap.tmp"
          mv "$snap.tmp" "$snap"

          git -C "$wt" config user.name "github-actions[bot]"
          git -C "$wt" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$wt" add timeline
          git -C "$wt" commit -m "perf: backfill test262.total into $(basename "$snap")"
          git -C "$wt" push "$remote" HEAD:perf-data
