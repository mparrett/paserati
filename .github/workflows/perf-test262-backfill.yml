name: Perf Test262 Backfill

# One-off backfill: measure an OLD commit's Test262 macro on a CURRENT runner and
# inject the `test262.*` series (total plus one per suite) into that commit's
# EXISTING perf-data snapshot — without
# touching its historical micro-benchmarks (so an existing spike/dip stays visible
# to overlay against).
#
# TOOLING AND ENGINE ARE SEPARATE REVISIONS. The engine measured is the target
# commit's: `paserati-test262` is built from its tree, which is the whole point.
# The post-processor (`cmd/bench-test262`) and the driver script are built from
# THIS WORKFLOW's commit in a git worktree, because they are tools, not subjects.
#
# The previous form source-grafted `cmd/bench-test262` into the target tree, which
# stopped working the moment the tool grew a dependency the old tree didn't have:
#
#     cmd/bench-test262/main.go:99:4: unknown field SetHash in struct literal
#         of type perfdata.StreamRecord
#
# Grafting the missing `pkg/perfdata` too would just move the boundary — the fix
# is not to graft at all. bench-test262 only reads the runner's -json output and
# emits StreamRecords; it never touches the engine, so nothing about it needs to
# come from the target commit. Same pattern as the ratio verifier in
# perf-timeline.yml, for the same reason.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA(s) to backfill into — space, comma or newline separated. Each must already have a snapshot. Targets already carrying the metric, or with no snapshot on the runner this run draws, are skipped rather than failed.'
        required: true
      only_tiers:
        description: 'Optional: comma-separated CPU-model substrings (e.g. "7763"). Abort in seconds unless this runner matches one. Empty = accept any tier — with a target list, usually what you want.'
        required: false
        default: ''
      max_targets:
        description: 'Cap targets measured in one run (default 6). The macro is ~4 min each and the job holds the perf-data writer lock throughout; deferred targets are named in the log.'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  # Share the perf-data writer lock with the timeline so snapshots don't collide.
  # NOTE: this serializes writers but does NOT queue them — GitHub keeps one
  # pending run per group, so a second dispatch evicts the first's pending run.
  # Dispatch ONCE with every target you want; do not fire one run per target.
  # That is what the `ref` list is for, and firing three at once on 2026-08-09
  # evicted the middle one's pending run exactly as described here.
  group: perf-timeline-main
  cancel-in-progress: false

env:
  PER_TEST_TIMEOUT: 1.2s

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Was 40 for a single target. A capped batch of 6 is ~25 min of macro plus
    # setup and per-target rebuilds; 180 leaves room without letting a wedged run
    # hold the perf-data writer lock indefinitely.
    timeout-minutes: 180
    steps:
      # Which CPU tier this dispatch drew is not decided until the inject step
      # runs `perf-migrate -print-key` — roughly nine minutes in, after the macro.
      # That is the authoritative answer and it stays where it is. But runner
      # assignment is a lottery weighted hard toward EPYC-7763 (53 of 67 snapshots;
      # the two Intel tiers are 3 between them), so filling a named tier means
      # re-dispatching until it comes up, and every miss currently costs a full
      # measurement to discover.
      #
      # This is a PREFILTER, not a second implementation of the machine key. On
      # linux `perfdata.detectCPUModel` returns the first `model name` line of
      # /proc/cpuinfo verbatim, which is the same string read here — and unlike a
      # shell re-derivation of the key, a wrong answer here cannot mis-file a
      # measurement into another tier's profile. It can only abort before anything
      # is measured or written, or let a run proceed to the real check.
      #
      # Runs before checkout deliberately: /proc/cpuinfo needs no repo.
      - name: Fast-fail unless this runner is a wanted tier
        if: github.event.inputs.only_tiers != ''
        env:
          ONLY_TIERS: ${{ github.event.inputs.only_tiers }}
        run: |
          set -euo pipefail
          model="$(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
          echo "runner CPU: ${model:-unknown}"
          IFS=',' read -ra want <<< "$ONLY_TIERS"
          for w in "${want[@]}"; do
            w="${w//[[:space:]]/}"
            [ -n "$w" ] || continue
            if printf '%s' "$model" | grep -qiF -- "$w"; then
              echo "matches wanted tier '${w}' — continuing"
              exit 0
            fi
          done
          echo "::error::runner tier '${model}' is not in {${ONLY_TIERS}}. Aborted before the macro; nothing measured, nothing written. Re-dispatch." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs before the target checkout, while the tree is still this workflow's
      # commit — a backfill target predates this script.
      - name: Check the perf-data writer queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/perf-writer-queue-check.sh "${{ github.repository }}"


      # ---- shared setup -------------------------------------------------
      # Everything here is per-RUN, not per-target: the corpus, the toolchain and
      # the tool binaries are the same for every commit measured in this job.
      # Hoisting them above the loop is most of why batching pays — the marginal
      # cost of a second target is its macro, not another cold setup.

      - name: Cache Test262 corpus
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('.test262-rev') }}
          restore-keys: test262-

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tool half of the tool/engine split. Built from the workflow's own
      # commit, where its dependencies are consistent by construction.
      #
      # Binaries only. Installing the driver into the target tree is per-target
      # and lives in the loop, because `git checkout --force` between targets
      # discards it.
      - name: Build macro tooling from this workflow's commit
        id: tools
        run: |
          set -euo pipefail
          tool="${RUNNER_TEMP}/tooling"
          rm -rf "$tool"
          git worktree add --detach "$tool" "${{ github.sha }}" >/dev/null
          ( cd "$tool" && go build -o "${RUNNER_TEMP}/bench-test262" ./cmd/bench-test262 )
          echo "bench=${RUNNER_TEMP}/bench-test262" >> "$GITHUB_OUTPUT"
          # The reducer runs FROM the tool worktree rather than being copied in: it
          # only post-processes the driver's output, so nothing about it belongs to
          # the target tree. Same script the forward timeline uses, so the two cannot
          # reduce differently.
          chmod +x "$tool/scripts/macro-test262-reduce.sh"
          echo "reduce=$tool/scripts/macro-test262-reduce.sh" >> "$GITHUB_OUTPUT"

      # Which targets is THIS runner good for? Answered once, before any
      # measuring, against the authoritative machine key — the same function
      # bench-ratchet writes with, from the tool worktree, because deriving it in
      # shell would be a second implementation of "which machine is this".
      #
      # A run that draws a tier is no longer worth one target. It is worth every
      # target that needs that tier, which is the whole point of the list input.
      - name: Select the targets this runner can measure
        id: select
        env:
          TARGET_REFS: ${{ github.event.inputs.ref }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          wt="${RUNNER_TEMP}/perf-data"
          rm -rf "$wt"
          git clone --depth 1 --branch perf-data "$remote" "$wt"

          this_key="$( cd "${RUNNER_TEMP}/tooling" && go run ./cmd/perf-migrate -print-key )"
          echo "this runner is ${this_key}"
          echo "key=${this_key}" >> "$GITHUB_OUTPUT"

          # Commas and newlines are both natural ways to paste a list into a
          # dispatch box; accept either, plus plain spaces.
          refs="$(printf '%s' "$TARGET_REFS" | tr ',\n\r\t' '    ')"
          # shellcheck disable=SC2086  # deliberate word-splitting of the ref list
          set -- $refs
          [ "$#" -gt 0 ] || { echo "::error::no target refs given" >&2; exit 1; }

          python3 "${RUNNER_TEMP}/tooling/scripts/perf-backfill-select.py" \
            --timeline "$wt/timeline" --key "$this_key" \
            --limit "${MAX_TARGETS:-6}" "$@" > "${RUNNER_TEMP}/targets.txt"

          n="$(grep -c . "${RUNNER_TEMP}/targets.txt" || true)"
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
          echo "selected ${n:-0} target(s) for ${this_key}"

      # Nothing to do is a SUCCESS. Once a tier is full every further dispatch
      # that draws it has nothing to measure, and painting those runs red is the
      # noise this change exists to remove — four of eight runs on 2026-08-09
      # were red for exactly this reason and every one of them was working
      # correctly.
      - name: Nothing to measure on this tier
        if: steps.select.outputs.count == '0'
        run: |
          echo "No target needs a point on ${{ steps.select.outputs.key }}."
          echo "Either they already carry the metric, or their snapshots are on other tiers."
          echo "Re-dispatch to draw a different runner."

      # ---- per-target loop ----------------------------------------------
      # One step rather than the previous six, because the sequence has to repeat
      # and GitHub has no step-level loop. The trade is step granularity in the
      # UI for a run that uses the tier it won; ::group:: markers keep each
      # target foldable in the log.
      #
      # Each target pushes its own commit. A batch that times out or is cancelled
      # then keeps everything it finished, and re-dispatching skips those targets
      # because the selector sees the metric already present.
      - name: Measure and inject each target
        if: steps.select.outputs.count != '0'
        env:
          BENCH_TEST262_BIN: ${{ steps.tools.outputs.bench }}
          THIS_KEY: ${{ steps.select.outputs.key }}
          TOOL_WT: ${{ runner.temp }}/tooling
          PERF_DATA_WT: ${{ runner.temp }}/perf-data
          REDUCE_SH: ${{ steps.tools.outputs.reduce }}
        run: |
          set -euo pipefail
          export PERF_DATA_REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C "$PERF_DATA_WT" config user.name "github-actions[bot]"
          git -C "$PERF_DATA_WT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each target runs as a CHILD PROCESS, not a function or subshell.
          # bash suppresses `set -e` for any compound command in an AND-OR list,
          # so `( set -e; body ) || rc=$?` runs straight past its own failures —
          # one target's broken build would silently corrupt the next target's
          # measurement instead of skipping it. A child keeps its own -e.
          #
          # Read the list on fd 3: the body runs git, go and jq, and anything in
          # there reading stdin would eat the rest of the list.
          pushed=0; nochange=0; failed=""
          while IFS= read -r target <&3; do
            [ -n "$target" ] || continue
            echo "::group::${target}"
            rc=0
            bash "${TOOL_WT}/scripts/perf-backfill-one.sh" "$target" || rc=$?
            case "$rc" in
              0) pushed=$(( pushed + 1 )) ;;
              3) nochange=$(( nochange + 1 )) ;;
              *) failed="${failed}${failed:+, }${target}" ;;
            esac
            echo "::endgroup::"
          done 3< "${RUNNER_TEMP}/targets.txt"

          echo "pushed ${pushed}, unchanged ${nochange}, failed $(printf '%s' "$failed" | awk -F', ' '{print ($0==""?0:NF)}')"
          [ -z "$failed" ] || echo "::warning::failed targets: ${failed}"

          # A batch succeeds if anything landed. Individual failures are reported
          # above and must not condemn the targets that worked — re-dispatching
          # skips what is already done, so a partial batch is progress.
          if [ "$pushed" -eq 0 ] && [ "$nochange" -eq 0 ]; then
            echo "::error::no target was measured; see the per-target errors above" >&2
            exit 1
          fi
